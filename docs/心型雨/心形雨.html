<!DOCTYPE html><html lang=en><head><meta charset=UTF-8><meta content="width=device-width,initial-scale=1" name=viewport><meta content="ie=edge" http-equiv=X-UA-Compatible><title>看看你考试怎样</title><style>*{box-sizing:border-box}body{background:red;margin:0;padding:0;overflow:hidden;text-shadow:0 0 80px}h1{margin:0;padding:0;color:#fff}a{color:#fff}p{margin:0}.box{width:700px;text-align:center;color:#fff;position:absolute;margin:20px auto 0;top:20px;left:0;right:0}img{width:700px;height:390px;border:2px solid #fff;border-radius:5px;transition:.8s}.img2:hover{border:2px solid #fff}.box>div{padding:20px}.szj{position:absolute;top:0;left:0;color:#fff;padding:5px;border:1px solid #eee;background-color:rgb(255,255,255,.7)}.yl{display:inline;border-bottom:1px dotted #fff}.yl a{text-decoration:none;color:#fff}.yl span{margin-right:8px}</style></head><body><canvas id=canvas></canvas><h1></h1><br><script>var canvas=document.getElementById("canvas"),ctx=canvas.getContext("2d");canvas.height=window.innerHeight,canvas.width=window.innerWidth;for(var texts="米艾❤️".split(""),fontSize=16,columns=canvas.width/fontSize,drops=[],x=0;x<columns;x++)drops[x]=1;function draw(){ctx.fillStyle="rgba(0, 0, 0, 0.05)",ctx.fillRect(0,0,canvas.width,canvas.height),ctx.fillStyle="#f00",ctx.font=fontSize+"px arial";for(var t=0;t<drops.length;t++){var n=texts[Math.floor(Math.random()*texts.length)];ctx.fillText(n,t*fontSize,drops[t]*fontSize),(drops[t]*fontSize>canvas.height||Math.random()>.95)&&(drops[t]=0),drops[t]++}}setInterval(draw,33)</script></body></html>
